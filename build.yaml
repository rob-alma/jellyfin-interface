framework: "net9.0"
overview: "A streamlined, cinematic home screen"
description: >
  Replaces the Jellyfin web home screen with a streamlined, cinematic one:
  a rotating hero banner, merged Continue Watching, Recommended For You (with
  the Personal Recommendations plugin), Coming Soon, Watch List, Favorites and
  genre rows, with hover previews; streamlined Movies and Shows pages, a
  Collections page and a search page.
category: "General"
owner: "robalma7"
artifacts:
- "Jellyfin.Plugin.Streamline.dll"
- "Newtonsoft.Json.dll"
changelog: >
  0.17.0: Works in Jellyfin Desktop / Jellyfin Media Player 1.12 (Qt 5.15, an older Chromium): it showed nothing there, because a browser function it used doesn't exist in that engine; that's now filled in, the layout has fallbacks for that engine (card sizes, spacing, colours), and if anything still goes wrong Streamline steps aside so Jellyfin's own pages show instead of a blank one. Genres are limited to the approved list: other genres (Kids, Soap, Reality, Biography, TV Movie...) no longer show as rows, tiles, search results or in Customize, and Dutch genre names (Actie, Komedie, Misdaad...) count as their English genres. Collections: brands TMDb splits into many small series are one collection (Barbie, LEGO, Scooby-Doo, Pokemon, Tom and Jerry, My Little Pony, Tinker Bell, Winnie the Pooh, Dragon Ball built in; others whose series names and movies all start with the same word are merged automatically), and a TMDb series that a franchise already covers isn't listed again.
  0.16.0: Genre rows per person. They're ordered by what that person watches, favorites and rates (rated down sinks; genres outside the admin's list can come in when they watch them a lot), and a Customize button on the first genre row lets them pin genres to the top (in their own order, shown even with only a title or two), hide genres, or turn the automatic order off. Stored per user like the Watch List; the taste is worked out at night (with the collections, 5:00) and updated per title during the day when someone watches, favorites or rates something. People without any history get the admin's order.
  0.15.0: User view is a real view as the test account picked in the settings (sam on the test server): signed in through Quick Connect in a frame over the page, with that account's own Watch List, Favorites, ratings and menus, while you stay signed in; the phone preview follows it; closing signs it out again. Collections are prepared once for the whole library (on the first start, then nightly at 5:00, after the metadata and title fixes) and saved, instead of being worked out per user every 15 minutes; during the day only new titles are worked in, at most every 30 minutes. Big collections (decades, Under 90 Minutes) come in parts so the list stays small; Part of looks a title up directly. Collections made in Jellyfin are no longer shown unless switched on, and Jellyfin's own Collections library is left out of the top bar. Search's typo list loads names only, and keyword genre tiles are counted by the server.
  0.14.0: Coming Soon only shows episodes about to air (requests are no longer listed; they still land on the requester's Watch List). Collections page order: Featured, Franchises, Movie series, Decades, Directors. New Featured collection: Book Adaptations. A TMDb movie series becomes a franchise by itself when a spin-off show is here (a show named after one of its movies, like Jurassic World: Camp Cretaceous). The admin side menu has Home at the top, and so does the dashboard's own menu. With the phone preview setting on, admins get a User view button to see the menus the way a regular user does.
  0.13.0: Search shows people first, then collections, genres and the titles; it forgives typos (a letter or two off: musicl, intersteller, jams bond) and understands Dutch genre and collection words (oorlogsfilms, romantische komedie, tekenfilms, natuurdocumentaires, jaren 80, klassiekers). Home has a Collections row, and its bottom tiles are two by two: Shows, Movies, Genres, Collections. Item pages say which collections a title is part of (with links). New collections: Award-winning Shows (Emmy winners), Classics (before 1980) and the 80s, 90s, 00s, 10s and 20s. The side menu is only for admins and only has Dashboard and Metadata Manager; Settings and Sign out are under the person icon for everyone. Coming Soon no longer shows who requested something. No more Recently Added tag. Smaller banner on phones.
  0.12.0: Collections page starts with Featured: Disney, Marvel (the MCU and X-Men), DC (Batman, Superman and the rest of DC), Pixar, Musicals, Best Picture Winners, Studio Ghibli, DreamWorks Animation, Christmas, Halloween, A24, Stephen King, Video Game Adaptations and Under 90 Minutes, each shown once 3 titles are here; the admin's own collections go first. New franchises: X-Men, Batman, Superman. New Directors section: everyone who directed 4 or more movies here. Tiles show different posters where they can. Search: exact short names (DC, 007) work, a collection found by its own name comes before one found by an alias, and a found title only brings in its franchise or movie series.
  0.11.0: Collections in the top bar and the phone tab bar: franchises that span movies and shows (Marvel Cinematic Universe, Star Wars, DC, Breaking Bad, Game of Thrones, Middle-earth, Wizarding World and more, worked out from TMDb collections, keywords, studios and titles), movie series from TMDb with 3 or more movies here (James Bond...), and collections made in Jellyfin; each opens a page in release order. Admins can add their own on the settings page. Search finds collections (by name, by a title in them, or by genre: superhero finds the Marvel universe), genres and sub-genres by name or keyword (musical, superhero, war movies, anime shows), and shows their titles too. Sub-genres cut to 28 plus Nature Documentaries and Anime; War and History are one genre each, shows included via their keywords; Documentary shows as Documentaries. Shows page has an Anime row under Action. Search opened again with another query no longer shows the old results.
  0.10.0: Top 10 removed everywhere. Ratings are private: nobody sees how others rated (the household average is gone), and your ratings only shape your own Recommended row. Watch List and Favorites are strictly per user (no endpoint takes another user's id). A title you watch drops off your Watch List, unless you add it again after watching it. Coming Soon: new episodes are personal (shows you watch, have on your Watch List or favorited), requested titles on their way show for everyone. Wrong titles are fixed straight away and checked again 10 minutes later; anything still wrong (or without a poster) goes on a list on the settings page with Open and Done buttons. Tag periods: New Series/New Episodes 30 days, New Release 60, Recently Added 15, banner 30. Search starts with your Recommended titles. Optional phone preview button for testing (setting, off by default).
  0.9.0: Phone tab bar (Home, Movies, Shows, Watch List, Favorites). New search page: big search field, genre shortcuts, results as posters plus matching people, Popular on Jellyfin before typing. Coming Soon row (home; Movies/Shows get their part): new episodes of shows you watch whose season started recently, and requested titles on their way, within the next month (needs Seerr). Trailer moved to right under the summary. Item pages hide the keyword wall and the audio/subtitle pickers (file details stay under the ⋯ menu's Media Info). The rating button says Rate until it's first used. Empty pages say what to do. Accent colour is now Jellyfin's light purple. No classic-layout switch for users anymore. Home's bottom tile says Shows.
  0.8.2: Everything in New on Jellyfin (row and see-all page) is tagged Recently Added. Seerr requests are added retroactively too: anything requested before Seerr was connected that's already in the library goes on the requester's Watch List (once). Phones: tags fit on poster cards, the banner's More info becomes a round info button so all its buttons fit one line, item-page buttons fit one line. Watch List sort renamed Added to list (was confusingly close to Recently added).
  0.8.1: Recently Added tag (blue, like the others) on movies and shows added to the server in the last 30 days (configurable), on every card in rows, grids and the banner; New Release / New Series / New Episodes take priority. No Favorites heart on episode and season pages (favorites are for movies and whole shows); on an episode's preview the heart says which show it favorites.
  0.8.0: Seerr: requested titles go on the requester's Watch List as soon as they're in Jellyfin (polls Seerr's request list every 10 minutes and right after new titles arrive; requesters matched by their linked Jellyfin account or user name; each request once). Trailers: titles TMDb has no trailer for get one found automatically from KinoCheck (by TMDb id, no key), or YouTube search with an optional API key, saved into the title's own metadata; on arrival, daily, and when an item page is first opened. Titles without any trailer show no trailer section (no more search link). Wrong titles and posters: titles whose match doesn't fit their folder name and year (or that aren't identified) are re-identified when exactly one result clearly fits; missing posters are fetched again; on arrival and daily ("Fix wrong titles and posters"); uncertain ones are listed on the settings page. Shuffle button hidden on item pages.
  0.7.0: My List is now called Watch List, and Favorites has its own link in the top bar. Item pages (movies, shows, seasons, episodes) use the same round buttons as everywhere else (play, + Watch List, heart, rating, double check for watched); Jellyfin's own watched check and heart are hidden, so there are no two check marks side by side, and its Trailer button is hidden when the trailer is embedded. Every item page gets a trailer section, under Next Up and above the seasons; seasons and episodes show their show's trailer; trailers are checked through YouTube's oEmbed (dead or embed-blocked links dropped, real titles shown, ads and TV spots left out when there are real trailers, best first), with a YouTube search link when there's none yet. New media: titles added by any route (Radarr/Sonarr/Seerr or by hand) that are still missing genres, keywords or a trailer 15 minutes later get them fetched again, and a daily task keeps retrying recent additions (gap-filling only). About 40 more sub-genres (Musicals, Biopics, Period Dramas, Legal and Medical Dramas, Sitcoms, Superheroes, Psychological Thrillers, Feel-Good, Mind-Bending...).
  0.6.0: My List and Favorites are now two things. My List (+) is a watchlist of movies and shows still to watch, kept per user by the plugin (new /Streamline/Watchlist endpoints, one small file per user); watched titles drop off it. Favorites (heart) are Jellyfin's own favorites. Hover previews and the banner have both buttons; item pages get a + next to Jellyfin's own heart. Home, Movies and Shows have a Favorites row under My List, each with its own see-all page; the My List page sorts by date added by default. Trailers play again: Jellyfin's pages send no referrer, which YouTube now rejects (error 153), so the trailer frame sends just the server's address; plus a Watch on YouTube link.
  0.5.0: Ratings: a thumbs button next to My List (hover previews, the banner, and item pages) opens five faces, Terrible / Bad / Okay / Good / Amazing; stored in each user's own Jellyfin data (UserData.Rating 2-10, Likes kept in step), with the household average (and how many rated) shown in previews and on item pages via a new /Streamline/Ratings endpoint that only returns aggregates. Item pages for movies and shows get an embedded trailer above the cast, from TMDb's YouTube links: only a thumbnail loads until play is pressed, then it plays from youtube-nocookie.com; stops when leaving the page; several trailers get Trailer 1/2/3 chips. The Genres page drops its sub-headings: headline genres (Action, Drama, Adventure, Fantasy, Sci-Fi, Romance, Comedy, Horror, Thriller; configurable) in bigger tiles, then sub-genres and the rest. Science Fiction is shown as Sci-Fi. Switching between pages no longer flashes Jellyfin's tab row or solid header for a moment.
  0.4.1: Shows get Romance, Fantasy, Science Fiction, Horror and Thriller rows from their TMDb keywords, since TMDb's TV genres have no Romance/Horror/Thriller and lump Fantasy in with Sci-Fi; TV's combined genres (Sci-Fi & Fantasy, Action & Adventure, War & Politics) are split into their parts instead of shown as such. Home banner alternates new movies and new shows.
  0.4.0: Sort chips (top rated, recently added, release date, title) plus a direction button (newest/oldest first, A-Z/Z-A) on every see-all page, including New on Jellyfin and Recommended (which also has Best match). Blue tags on every card, in every row, grid and the banner, by air date: New Series (only its first season has aired) or New Episodes (new season or episodes of an older show) until 30 days after the latest episode aired, New Release for movies until 60 days after release; both configurable. The header looks the same on every page: menu, logo, Home / Movies / Shows / My List; Jellyfin's back/home buttons, page title and second row of tabs are hidden (phones keep Jellyfin's header). Movies and Shows pages add sub-genre rows (genre pairs like Sci-Fi Action or Crime Dramas, and themes from TMDb keywords like Dystopian, Space, Heists) between the main and the remaining genres, and end with All Movies/All Shows and a new All Genres page: poster tiles with a 2x2 collage, main genres, then sub-genres, then the rest by size. The + (My List) button in hover previews now also works for episodes (adds the show). Fixed building a page twice when going from one see-all page to another.
  0.3.0: Movies and Shows pages get the streamlined layout too (banner of new titles, My List, Recommended For You, Critically Acclaimed, the main genres, then every other genre), on their first tab; Jellyfin's other tabs are unchanged. Every row (on home too) ends in a See all card and has an Explore all link that opens a streamlined grid page with sorting (top rated, recently added, newest, A-Z): genre pages are movies only on the Movies page, shows only on the Shows page, both on home. New on Jellyfin covers everything added in the last 30 days, whole new titles or new episodes, labelled. My List in the nav opens the same kind of page. Rotten Tomatoes score shown with a drawn tomato instead of an emoji. New setting to keep the library pages stock.
  0.2.0: Nav bar (Home, libraries, My List) now stays on every page, and going Home from Jellyfin's own menu always shows the new home screen (it could show the old one, or a blank page). Hero banner only features new titles: movies released in the last 90 days and shows that are new or got a new season or new episodes, each with a label. Top 10 blends what users here watched in the last 120 days with IMDb/TMDb and Rotten Tomatoes scores. Rows are titled 'Top 10 on Jellyfin' and 'New on Jellyfin'. New row order: Continue Watching, Top 10, Recommended For You, New on Jellyfin, My List, then genre rows (Action, Drama, Crime, Fantasy, Adventure, Romance, Comedy), then big Series and Movies browse buttons. Removed the Because you watched and Critically Acclaimed rows. Rotten Tomatoes score shown next to the rating.
  0.1.0: Initial release: new home screen.
