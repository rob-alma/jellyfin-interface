name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Streamline/Jellyfin.Plugin.Streamline.csproj

      - name: Build plugin (net9.0)
        run: dotnet build Jellyfin.Plugin.Streamline/Jellyfin.Plugin.Streamline.csproj --configuration Release --no-restore
